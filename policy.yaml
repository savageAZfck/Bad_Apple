# Bad Apple — declarative policy for the local tool cage.
# This file controls what the assistant is allowed to do, what needs
# explicit approval, and what is flat-out denied.

policy_version: "1.0"

# Global autopilot: when true, the assistant runs destructive tools
# immediately without asking. When false, tools with require_approval: true
# go through the human-in-the-loop flow.
# SECURITY: Default is false. Must be explicitly enabled by the user.
autopilot: false

# Proactive initiation: when true, Bad Apple queues macOS notifications for
# approvals waiting, kill-switch hits, and agent task outcomes (the menu bar
# tails ~/.bad_apple/notify_queue.jsonl). proactive_voice additionally lets
# voice-flagged events be spoken aloud through the voice host.
proactive_notify: true
proactive_voice: true

# Dream learning: during each daily consolidation pass Bad Apple curates the
# day's query/response exchanges into lora_data/dream-candidate, trains a
# bounded LoRA adapter (BADAPPLE_DREAM_ITERS, default 40), and adopts it into
# lora_adapters/dream — applied at next model load. The previous weights are
# kept as dream-prev for instant rollback. BADAPPLE_DREAM_INTERVAL detunes
# the cadence. Every pass lands on the audit ledger.
dream_learning: true

# Fleet beacon (opt-in): during each daily consolidation pass Bad Apple emits
# one Secure Enclave-signed check-in — version, arch, anonymised machine id —
# to this destination. Accepts an https:// endpoint or a file:// drop folder
# (e.g. a synced directory for zero-server fleet telemetry). Unset = silent.
# beacon_url: "file:///Users/you/Library/Mobile Documents/com~apple~CloudDocs/badapple-fleet"
# beacon_url: "https://fleet.example.com/checkin"

# Defaults for tools that are not explicitly listed below.
defaults:
  allowed: true
  require_approval: true
  allowed_paths: []
  denied_patterns: []
  allowed_apps: []
  allowed_files: []

# Tool-specific rules. An unlisted tool inherits from `defaults`.
tools:
  get_current_time:
    allowed: true
    require_approval: false

  list_directory:
    allowed: true
    require_approval: false
    allowed_paths: ["/Users", "/private"]

  read_file:
    allowed: true
    require_approval: false
    allowed_paths: ["/Users", "/private"]
    max_size: 10000

  search_content:
    allowed: true
    require_approval: false
    allowed_paths: ["/Users", "/private"]
    max_timeout: 15

  search_local_files:
    allowed: true
    require_approval: false
    max_timeout: 15

  write_file:
    allowed: true
    require_approval: true
    notes_dir: "~/.bad_apple/notes"
    denied_patterns:
      - "../"
      - "..\\"
      - "~/.ssh"
      - "~/.aws"
      - "/etc"
      - "/usr"

  run_shell:
    allowed: true
    require_approval: true
    allowed_commands:
      - ls
      - cat
      - head
      - tail
      - find
      - grep
      - wc
      - file
      - pwd
      - mdfind
      - ps
      - df
      - du
      - echo
      - which
    denied_patterns:
      - "curl"
      - "wget"
      - "ftp"
      - "ssh"
      - "scp"
      - "rsync"
      - "nc "
      - "netcat"
      - "bash -c"
      - "sh -c"
      - "rm -rf /"
      - ":(){"
    max_timeout: 15

  run_applescript:
    allowed: true
    require_approval: true
    allowed_apps: []
    denied_patterns:
      - "do shell script"
      - "curl"
      - "wget"
      - "rm -rf"
    max_timeout: 15

  index_documents:
    allowed: true
    require_approval: true
    allowed_paths: ["/Users", "/private"]

