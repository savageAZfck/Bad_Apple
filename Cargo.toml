[package]
name = "sapient_soul"
version = "0.1.0"
edition = "2021"
authors = ["Adam Clark <savagetism@icloud.com>"]
license-file = "LICENSE.txt"
description = "Firefly AGI Core — a local-first, self-training AGI research runtime"
build = "build.rs"

[lib]
name = "sapient_soul"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "sapient_soul"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
md-5 = "0.10"
ndarray = "0.15"
dashmap = "6.0"
sysinfo = "0.30"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
starship-battery = "0.10"
chrono = "0.4"
candle-core = { version = "0.10.2", features = ["metal", "accelerate"] }
candle-nn = { version = "0.10.2", features = ["metal"] }
tokenizers = "0.15"
sled = "0.34"
notify = "6.1"
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.0"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-tungstenite = { version = "0.23.1", default-features = false, features = ["connect", "handshake", "stream"] }
futures-util = "0.3.33"
crossbeam-queue = "0.3.12"
crossbeam-utils = "0.8.21"
libloading = "0.8.6"
libc = "0.2"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"
