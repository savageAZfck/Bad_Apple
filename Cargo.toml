[package]
name = "bad_apple"
version = "0.1.0"
edition = "2021"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/Bad_Apple"
license = "LicenseRef-Proprietary"
description = "Bad Apple — an air-gapped, ANE-sharded cognitive substrate"
build = "build.rs"
default-run = "badapple"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "badapple"
path = "src/bin/badapple.rs"

[[bin]]
name = "train_gatekeeper"
path = "src/bin/train_gatekeeper.rs"

[[bin]]
name = "gatekeeper"
path = "src/bin/gatekeeper.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
md-5 = "0.10"
ndarray = "0.15"
dashmap = "6.0"
sysinfo = "0.30"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
starship-battery = "0.10"
chrono = "0.4"
candle-core = { version = "0.10.2", features = ["metal", "accelerate"] }
candle-nn = { version = "0.10.2", features = ["metal"] }
tokenizers = "0.22"
sled = "0.34"
notify = "6.1"
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.22"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = { version = "0.23.1", default-features = false, features = ["connect", "handshake", "stream"] }
futures-util = "0.3.33"
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3.12"
crossbeam-utils = "0.8.21"
libloading = "0.8.6"
libc = "0.2"
memmap2 = "0.9.11"
half = "2"
bytemuck = { version = "1.25.2", features = ["derive"] }
regex = "1.10"
dirs = "5"
wasmi = "0.35.0"
wasmparser = { version = "0.100.2", package = "wasmparser-nostd", default-features = false }
metal = "0.29.0"
safetensors = "0.7.0"
objc2-metal = "0.3.2"
hf-chat-template = "1.0.0"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"
