name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly fuzz run at 3 AM UTC
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, build, test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: |
          brew install cmake
      - name: Cargo fmt check
        run: cargo fmt --check
      - name: Cargo clippy
        run: cargo clippy --release -- -D warnings
      - name: Cargo build
        run: cargo build --release
      - name: Cargo test
        run: cargo test --release
      - name: Cargo audit
        run: |
          cargo install cargo-audit
          cargo audit

  install-test:
    name: Clean install test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: brew install cmake
      - name: Build apple bridge (identity binary)
        run: bash src/platform/apple_bridge/build_apple_bridge.sh
      - name: Run install test
        run: |
          cargo build --release
          BADAPPLE_NO_SIGN=1 src/platform/apple_desktop/build_bad_apple_menu_bar.sh
          tests/test_clean_install.sh
      - name: Swift inference self-test
        working-directory: src/platform/apple_desktop/MLXInference
        run: swift run -c release BadAppleMLXSelfTest
      - name: Swift native logic tests
        run: |
          xcrun swiftc -O \
            src/platform/apple_desktop/BadAppleHumanLayer.swift \
            src/platform/apple_desktop/BadAppleTools.swift \
            src/platform/apple_desktop/BadAppleSecurity.swift \
            src/platform/apple_desktop/BadAppleRAG.swift \
            tests/test_badapple_native_logic.swift \
            -o /tmp/badapple-native-logic-tests
          /tmp/badapple-native-logic-tests
      - name: Swift human layer tests
        run: |
          xcrun swiftc -O \
            src/platform/apple_desktop/BadAppleHumanLayer.swift \
            tests/test_badapple_human_layer.swift \
            -o /tmp/badapple-human-layer-tests
          /tmp/badapple-human-layer-tests
      - name: Swift conversation tests
        run: |
          xcrun swiftc -O \
            src/platform/apple_desktop/BadAppleConversation.swift \
            tests/test_badapple_conversation.swift \
            -o /tmp/badapple-conversation-tests
          /tmp/badapple-conversation-tests
      - name: Swift native runtime tests
        run: |
          xcrun swiftc -swift-version 5 \
            src/platform/apple_desktop/BadAppleNativeRuntime.swift \
            tests/test_badapple_native_runtime.swift \
            -o /tmp/badapple-native-runtime-tests
          /tmp/badapple-native-runtime-tests

  fuzz:
    name: Fuzz (nightly only)
    runs-on: macos-15
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz IPC frame
        run: cargo +nightly fuzz run fuzz_ipc_frame -- -max_total_time=300 -max_len=65536
      - name: Fuzz WASM cage
        run: cargo +nightly fuzz run fuzz_wasm_cage -- -max_total_time=300 -max_len=8192
      - name: Fuzz protocol frame
        run: cargo +nightly fuzz run fuzz_protocol_frame -- -max_total_time=300 -max_len=65536
      - name: Fuzz scavenger path
        run: cargo +nightly fuzz run fuzz_scavenger_path -- -max_total_time=300 -max_len=4096
      - name: Check for crashes
        run: |
          for target in fuzz_ipc_frame fuzz_wasm_cage fuzz_protocol_frame fuzz_scavenger_path; do
            crashes=$(ls fuzz/artifacts/$target/ 2>/dev/null | wc -l)
            if [ "$crashes" -gt 0 ]; then
              echo "::error::Fuzzer $target found $crashes crashes"
              exit 1
            fi
          done
          echo "All fuzzers completed with zero crashes"
