<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Apple — Ambient</title>
  <link rel="stylesheet" href="/static/styles.css?v=7">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">BA</div>
      <div>
        <div class="title">Bad Apple</div>
        <div class="subtitle">Local OS</div>
      </div>
    </div>
    <nav>
      <a class="nav-item" href="/">Dashboard</a>
      <a class="nav-item" href="/chat">Chat</a>
      <a class="nav-item" href="/ocular">Ocular</a>
      <a class="nav-item" href="/models">Models</a>
      <a class="nav-item" href="/agents">Agents</a>
      <a class="nav-item active" href="/ambient">Ambient</a>
      <a class="nav-item" href="/control">Control</a>
      <a class="nav-item" href="/mcp">MCP</a>
      <a class="nav-item" href="/settings">Settings</a>
      <a class="nav-item" href="/logs">Logs</a>
    </nav>
  </aside>

  <main class="content">
    <h2>Ambient Context</h2>
    <p class="subtitle">What Bad Apple sees and remembers in the background.</p>

    <section class="card">
      <h3>Current snapshot <span id="ambient-status" class="badge">off</span></h3>
      <pre id="ambient-context" class="json-box">Loading...</pre>
      <img id="ambient-screen" src="/api/ocular/screen.png" alt="latest screen" style="max-width: 100%; border-radius: 0.5rem; margin-top: 1rem; display: none;">
    </section>

    <section class="card">
      <h3>Remembered facts</h3>
      <div id="ambient-facts"><span class="text-tertiary">Loading...</span></div>
    </section>

    <section class="card">
      <h3>Recent episodes</h3>
      <div id="ambient-episodes"><span class="text-tertiary">Loading...</span></div>
    </section>
  </main>

  <script>
    async function load() {
      const data = await fetch('/api/ambient').then(r => r.json());
      document.getElementById('ambient-status').textContent = data.running ? 'running' : 'off';
      document.getElementById('ambient-status').className = 'badge ' + (data.running ? 'ok' : 'bad');
      document.getElementById('ambient-context').textContent = JSON.stringify(data.context || {}, null, 2);

      const facts = document.getElementById('ambient-facts');
      facts.innerHTML = '';
      if (data.recent_facts?.length) {
        data.recent_facts.forEach(f => {
          const div = document.createElement('div');
          div.className = 'fact-row';
          div.innerHTML = `<span class="fact-text">${escapeHtml(f.fact)}</span><span class="fact-time">${new Date(f.created).toLocaleString()}</span>`;
          facts.appendChild(div);
        });
      } else {
        facts.innerHTML = '<p class="muted">No ambient facts remembered yet.</p>';
      }

      const eps = document.getElementById('ambient-episodes');
      eps.innerHTML = '';
      if (data.recent_episodes?.length) {
        data.recent_episodes.forEach(e => {
          const div = document.createElement('div');
          div.className = 'episode-row';
          div.innerHTML = `<span class="episode-text">${escapeHtml(e.user)}</span><span class="episode-time">${new Date(e.created).toLocaleString()}</span>`;
          eps.appendChild(div);
        });
      } else {
        eps.innerHTML = '<p class="muted">No ambient episodes yet.</p>';
      }

      const img = data.context?.screen_path ? `/api/image/${data.context.screen_path.split('/').pop()}` : null;
      const screenEl = document.getElementById('ambient-screen');
      if (img) { screenEl.src = img; screenEl.style.display = 'block'; }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
