# cargo-deny configuration for Bad Apple.
# Run: cargo deny check

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[advisories]
# The pinned `candle-core`, `metal`, `tokenizers`, and `wasmi` ecosystems carry
# one remaining transitive unmaintained proc-macro (`paste`) that has no safe
# upgrade path today without migrating those larger crates. The sled/bincode
# advisories were resolved by replacing sled with redb and bincode with ciborium.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive proc-macro dep of candle-core 0.10.2/gemm/pulp, metal 0.29, tokenizers 0.22.2, and wasmi_core 0.35; removing it requires migrating the gatekeeper Candle brain, Metal UMA, tokenizer, and WASM cage to newer crates" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MulanPSL-2.0",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "LicenseRef-Proprietary",
]
confidence-threshold = 0.8

[licenses.private]
# Bad Apple is not published; skip private-registry license checks.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
